<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aritz.hub</title>
<link rel="icon" href="logo.png">
<style>
  :root { --bg: #2f2f2f; --bar: #1f2329; --text: #f2f2f2; --accent: #02b757; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: system-ui, sans-serif; background: linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.45)), url("fondo.jpg") center / cover fixed, var(--bg); color: var(--text); }
  header { background: rgba(31,35,41,.9); padding: 18px 24px; }
  .brand { display: flex; align-items: center; gap: 10px; max-width: 1000px; margin: 0 auto; font-size: 22px; font-weight: 800; }
  .logo { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex: none; }
  .logo-fallback { display: none; width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 18px; align-items: center; justify-content: center; flex: none; }
  main { text-align: center; padding: 56px 20px; }
  h1 { font-size: 26px; margin: 0 0 22px; }
  .thumb { width: min(560px, 100%); aspect-ratio: 16 / 9; object-fit: cover; border-radius: 24px; border: 3px solid var(--accent); box-shadow: 0 0 40px rgba(2,183,87,.45), 0 10px 40px rgba(0,0,0,.6); display: none; margin: 0 auto; }
  .banner { display: block; max-width: min(520px, 100%); max-height: 180px; object-fit: contain; margin: 0 auto 24px; border-radius: 12px; }
  .join { display: inline-block; margin-top: 24px; padding: 12px 30px; border-radius: 8px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 700; }
  .hint { opacity: .7; margin-top: 14px; font-size: 14px; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <img class="logo" id="logo" src="logo.png" alt="">
    <span class="logo-fallback" id="logoFallback">A</span>
    <span>Aritz.hub</span>
  </div>
</header>
<main>
  <img class="banner" src="banner.png" alt="" onerror="this.style.display='none'">
  <h1 id="title">Preparando invitación…</h1>
  <img class="thumb" id="thumb" alt="">
  <div><a class="join" id="join" href="#">Unirme ahora</a></div>
  <p class="hint" id="hint"></p>
  <p class="hint" id="alt" style="display:none">¿No se abre? Prueba <a id="app" href="#" style="color:#02b757">con la app de Roblox</a></p>
</main>
<script>
  // Estadísticas anónimas con GoatCounter (sin cookies, sin datos personales).
  // Cambia TUCODIGO por el código que elijas al crear tu cuenta en goatcounter.com
  const GOATCOUNTER_CODE = "https://theal.goatcounter.com/count";

  function track(path, title) {
    if (!GOATCOUNTER_CODE || GOATCOUNTER_CODE === "TUCODIGO") return;
    window.goatcounter = { no_onload: true };
    const gc = document.createElement("script");
    gc.async = true;
    gc.dataset.goatcounter = "https://" + GOATCOUNTER_CODE + ".goatcounter.com/count";
    gc.src = "https://gc.zgo.at/count.js";
    gc.onload = () => window.goatcounter.count({ path: path, title: title });
    document.head.appendChild(gc);
  }

  // Formato: #PLACEID/JOBID/NOMBRE/IMAGEN (nombre e imagen son opcionales)
  const [placeId, jobId, rawName, rawImg] = location.hash.slice(1).split("/");
  const ok = /^\d+$/.test(placeId || "") && /^[0-9a-fA-F-]{36}$/.test(jobId || "");

  // Si no existe logo.png, se muestra un círculo con la inicial
  const logo = document.getElementById("logo");
  logo.addEventListener("error", () => {
    logo.style.display = "none";
    document.getElementById("logoFallback").style.display = "flex";
  });

  const title = document.getElementById("title");
  const join = document.getElementById("join");

  if (!ok) {
    title.textContent = "Enlace de invitación no válido";
    join.style.display = "none";
  } else {
    let name = "";
    try { name = decodeURIComponent(rawName || ""); } catch (e) {}
    title.textContent = name ? "Uniéndote a " + name : "Uniéndote al servidor";

    // Cuenta la visita por juego; si el enlace lleva ?src=algo, también por origen
    const src = new URLSearchParams(location.search).get("src");
    track("/juego/" + placeId + (src ? "?src=" + encodeURIComponent(src) : ""), name || "Invitación");

    const thumb = document.getElementById("thumb");
    thumb.addEventListener("load", () => { thumb.style.display = "block"; });
    let img = "";
    try { img = "https://" + decodeURIComponent(rawImg || ""); } catch (e) {}
    let imgOk = false;
    try { imgOk = new URL(img).hostname.endsWith(".rbxcdn.com"); } catch (e) {}
    thumb.src = imgOk ? img : "https://www.roblox.com/asset-thumbnail/image?assetId=" + placeId + "&width=768&height=432&format=png";

    const query = "placeId=" + placeId + "&gameInstanceId=" + jobId;
    const webUrl = "https://www.roblox.com/games/start?" + query;
    const appUrl = "roblox://experiences/start?" + query;
    join.href = webUrl;
    document.getElementById("app").href = appUrl;
    document.getElementById("alt").style.display = "block";
    document.getElementById("hint").textContent = "Abriendo Roblox con tu cuenta del navegador…";
    setTimeout(() => { location.href = webUrl; }, 3000);
  }
</script>
</body>
</html>
