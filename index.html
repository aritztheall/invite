<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aritz.hub</title>
<link rel="icon" href="logo.png">
<style>
  :root { --bg: #2f2f2f; --bar: #1f2329; --text: #f2f2f2; --accent: #02b757; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--bar); padding: 18px 24px; }
  .brand { display: flex; align-items: center; gap: 10px; max-width: 1000px; margin: 0 auto; font-size: 22px; font-weight: 800; }
  .logo { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex: none; }
  .logo-fallback { display: none; width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 18px; align-items: center; justify-content: center; flex: none; }
  main { text-align: center; padding: 56px 20px; }
  h1 { font-size: 26px; margin: 0 0 22px; }
  .thumb { width: min(768px, 100%); aspect-ratio: 16 / 9; object-fit: cover; border-radius: 14px; display: none; margin: 0 auto; }
  .join { display: inline-block; margin-top: 24px; padding: 12px 30px; border-radius: 8px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 700; }
  .hint { opacity: .7; margin-top: 14px; font-size: 14px; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <img class="logo" id="logo" src="logo.png" alt="">
    <span class="logo-fallback" id="logoFallback">A</span>
    <span>Aritz.hub</span>
  </div>
</header>
<main>
  <h1 id="title">Preparando invitación…</h1>
  <img class="thumb" id="thumb" alt="">
  <div><a class="join" id="join" href="#">Unirme ahora</a></div>
  <p class="hint" id="hint"></p>
</main>
<script>
  // Formato: invite.html#PLACEID/JOBID/NOMBRE_DEL_JUEGO (el nombre es opcional)
  const [placeId, jobId, rawName] = location.hash.slice(1).split("/");
  const ok = /^\d+$/.test(placeId || "") && /^[0-9a-fA-F-]{36}$/.test(jobId || "");

  // Si no existe logo.png, se muestra un círculo con la inicial
  const logo = document.getElementById("logo");
  logo.addEventListener("error", () => {
    logo.style.display = "none";
    document.getElementById("logoFallback").style.display = "flex";
  });

  const title = document.getElementById("title");
  const join = document.getElementById("join");

  if (!ok) {
    title.textContent = "Enlace de invitación no válido";
    join.style.display = "none";
  } else {
    let name = "";
    try { name = decodeURIComponent(rawName || ""); } catch (e) {}
    title.textContent = name ? "Uniéndote a " + name : "Uniéndote al servidor";

    const thumb = document.getElementById("thumb");
    thumb.addEventListener("load", () => { thumb.style.display = "block"; });
    thumb.src = "https://www.roblox.com/asset-thumbnail/image?assetId=" + placeId + "&width=768&height=432&format=png";

    const url = "https://www.roblox.com/games/start?placeId=" + placeId + "&gameInstanceId=" + jobId;
    join.href = url;
    document.getElementById("hint").textContent = "Te redirigiremos en un momento…";
    setTimeout(() => { location.href = url; }, 1800);
  }
</script>
</body>
</html>
